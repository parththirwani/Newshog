services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newshog
      POSTGRES_PASSWORD: newshog
      POSTGRES_DB: newshog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    # Local overrides so the worker talks to this stack's containers over the
    # compose network, not the host-local endpoints in .env (which are
    # addressed from the host, e.g. for the dev server).
    environment:
      DATABASE_URL: postgresql://newshog:newshog@postgres:5432/newshog
      REDIS_URL: redis://redis:6379
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  pgdata:
